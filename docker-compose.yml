# Midnight proof server: generates Zero Knowledge proofs for contract transactions.
# Required for deploying and interacting with contracts.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    platform: linux/amd64
    environment:
      - PORT=6300
    ports:
      - "6300:6300"
    restart: unless-stopped
